version: '3'

services:
  db:
    image: postgres
    container_name: LibraryDb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library
    networks:
      - my_network
    ports:
      - 5433:5432

  app:
    image: library-app
    container_name: LibraryApp
    depends_on:
      - db
    environment:
      DB_HOST: LibraryDb2
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: library
    networks:
      - my_network
    ports:
      - 9090:8080

networks:
  my_network:
